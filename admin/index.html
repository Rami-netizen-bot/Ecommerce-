<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- 📌 ត្រូវមាន style ពេញលេញសម្រាប់ 3 Columns (Sidebar | Main Content | Detail Panel) -->
    <div class="admin-wrapper">
      <!-- 1. Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <h2 class="logo">Smart E-Commerce</h2>
          <ul class="nav-menu">
            <li onclick="location.href = '/dashboard.html'">Dashboard</li>
            <li class="active">Products</li>
            <li onclick="location.href = '/payments.html'">Payments</li>
            <li onclick="location.href = '/customers.html'">Customers</li>
            <li onclick="location.href = '/reports.html'">Reports</li>
            <li onclick="location.href = '/settings.html'">Settings</li>
          </ul>
        </div>
        <div class="sidebar-bottom">
          <span class="logout">Log out</span>
        </div>
      </aside>

      <!-- 2. Main Content (Table) -->
      <main class="main-content">
        <header class="main-header">
          <div>
            <h1>Product Management</h1>
            <p class="header-sub">
              Manage your inventory, pricing, and product catalog.
            </p>
          </div>
          <div class="user-profile">
            <span>Admin Panel</span>
          </div>
        </header>

        <!-- Table Section -->
        <div class="table-card">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Price</th>
                  <th>Category</th>
                  <th style="text-align: center">Actions</th>
                </tr>
              </thead>
              <tbody id="productTableBody">
                <tr>
                  <td colspan="5" class="text-center">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- 3. Detail Panel (Form សម្រាប់ Add Product ដែលបានបាត់បង់) -->
      <aside class="detail-panel">
        <div class="panel-header">
          <h3>Add New Product</h3>
        </div>
        <form id="productForm" class="panel-form">
          <div class="form-group">
            <label>Product Title</label>
            <input
              type="text"
              id="title"
              required
              placeholder="Enter product name"
            />
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input
              type="number"
              id="price"
              step="0.01"
              required
              placeholder="0.00"
            />
          </div>
          <div class="form-group">
            <label>Category</label>
            <input
              type="text"
              id="category"
              required
              placeholder="e.g. Electronics"
            />
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input
              type="text"
              id="image_url"
              placeholder="https://image.com/item.jpg"
            />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea
              id="description"
              rows="3"
              placeholder="Product details..."
            ></textarea>
          </div>
          <button type="submit" class="btn-submit">Save Product</button>
        </form>
      </aside>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
